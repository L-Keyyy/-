<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web AI 页面修改器测试页</title>
    <link rel="stylesheet" href="content.css" />
    <script src="content.js" defer></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f3f6fa; color: #17253b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header { padding: 28px 40px; background: #0b2451; color: white; }
      main { max-width: 1180px; margin: auto; padding: 30px; }
      .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .card, .section { padding: 22px; border: 1px solid #dbe5f1; border-radius: 14px; background: white; box-shadow: 0 8px 24px rgba(20,45,82,.05); }
      .card span { color: #64748b; }
      .card strong { display: block; margin-top: 10px; font-size: 28px; }
      .section { margin-top: 18px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 12px; border-bottom: 1px solid #e5ebf3; text-align: left; }
    </style>
  </head>
  <body>
    <header data-module-id="page-header">
      <h1>运营周报测试页面</h1>
      <p>用于验证框选、删除、新增、移动和撤回功能</p>
    </header>
    <main>
      <section class="metrics" data-module-id="metrics">
        <article class="card"><span>作业PPH</span><strong>20.95</strong></article>
        <article class="card"><span>总配送量</span><strong>407.2万</strong></article>
        <article class="card"><span>总工时</span><strong>19.4万h</strong></article>
      </section>
      <section class="section" data-module-id="watchlist">
        <h2>重点名单</h2>
        <p>可以选中本模块进行删除、移动、复制或添加AI说明。</p>
      </section>
      <section class="section" data-module-id="all-data">
        <h2>全量数据</h2>
        <table>
          <thead><tr><th>路区</th><th>配送量</th><th>作业PPH</th></tr></thead>
          <tbody>
            <tr><td>LAV-011</td><td>2,681</td><td>22.13</td></tr>
            <tr><td>LAV-024</td><td>2,465</td><td>26.68</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
